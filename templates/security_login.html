<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mewar Guardian – Security Login</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --primary: #3b82f6;
    --text: #f8fafc;
  }
  body {
    margin: 0; padding: 0;
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .login-card {
    background: var(--card);
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    text-align: center;
    width: 90%;
    max-width: 400px;
  }
  .brand-icon {
    font-size: 48px;
    margin-bottom: 16px;
  }
  .title {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 32px;
  }
  .form-input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    color: white;
    font-size: 16px;
    margin-bottom: 24px;
  }
  .btn-primary {
    width: 100%;
    padding: 14px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-primary:hover {
    background: #2563eb;
  }
  .error {
    color: #ef4444;
    background: rgba(239, 68, 68, 0.1);
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 24px;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="brand-icon">🛡️</div>
  <div class="title">Mewar Guardian</div>
  <div class="subtitle">Security Command Center Login</div>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/security-login">
    <input type="password" name="password" class="form-input" placeholder="Enter Security Password" required autofocus>
    <button type="submit" class="btn-primary">Access Dashboard</button>
  </form>
</div>

</body>
</html>
